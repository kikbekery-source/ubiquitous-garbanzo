            d="M 4 2 L 4 46 L 15 36 L 22 58 L 32 54 L 25 33 L 41 31 Z"
            fill="#0A0E16"
            stroke="#eef2fa"
            stroke-width="3"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>

    <!-- Scene 1: chapter card, hard cut out at 0.95s (clip-gated) -->
    <div id="f06-card" class="clip" data-start="0" data-duration="0.95" data-track-index="2">
      <div id="f06-card-inner">
        <div id="f06-card-ord">03</div>

        <div id="f06-card-title">ส่งเข้า LINE</div>

  </div>

  <script src="public/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* ── Authored coordinate truth (panel-local px, mirrored in the CSS above) ── */
      var CHIP1 = { x: 70, y: 430 };

      var SLOT1 = { x: 390, y: 760 }; /* msg card (90,660) + slot local (300,100) */
      var SLOT2 = { x: 390, y: 860 }; /* msg card (90,660) + slot local (300,200) */
      var GRIP = { dx: 34, dy: 30 }; /* cursor tip on the chip's grip dots */
      var D1 = { x: SLOT1.x - CHIP1.x, y: SLOT1.y - CHIP1.y }; /* 320, 330 */
      var D2 = { x: SLOT2.x - CHIP2.x, y: SLOT2.y - CHIP2.y }; /* 320, 350 */
      var TOGGLE = { x: 892, y: 42 }; /* Active track center */

      /* ── Series clock: slow countdown from 01:45:12 across the whole frame ── */
      var clockEl = document.getElementById("f06-clock-time");
      var CLOCK_START = 1 * 3600 + 45 * 60 + 12;
      var clock = { t: 0 };
      tl.to(
        clock,
        {
          t: 6,
          duration: 9.6,
          ease: "none",
          onUpdate: function () {
            var total = CLOCK_START - Math.floor(clock.t);
            var h = Math.floor(total / 3600);
            var m = Math.floor((total % 3600) / 60);
            var s = total % 60;
            clockEl.textContent =
              (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
          },
        },
        0,
      );

      /* ── Scene 1 (0.0–0.95s): chapter card — cut lands on VO cue "ต่อบล็อกไลน์" @1.00 ── */
      tl.fromTo(
        "#f06-card-title",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", immediateRender: false },
        0.03,
      );

      /* ── Scene 2 (1.0–2.5s): canvas revealed; chat node spring-pops; wire draws itself ── */
      tl.fromTo(
        "#f06-canvas",
        { scale: 0.985 },
        { scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false },
        0.95,
      );
      tl.fromTo(
        ["#f06-kick", "#f06-head"],
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.07, immediateRender: false },
        0.98,
      );

      /* chat node spring-pop onto the end of the line (VO @1.00) */
      tl.fromTo(
        "#f06-node-chat",
        { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.9)", immediateRender: false },
        1.0,
      );
      tl.fromTo(
        ["#f06-chat-label", "#f06-port-in"],
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power1.out", immediateRender: false },
        1.35,
      );

      /* wire draws from Webhook to the new node (svg-path-draw: measured length) */
      var wireBase = document.getElementById("f06-wire-base");
      var wireLen = wireBase.getTotalLength();
      wireBase.style.strokeDasharray = String(wireLen);
      wireBase.style.strokeDashoffset = String(wireLen);
      tl.to(
        "#f06-wire-base",
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
        1.65,
      );

      /* message field pops open + rows assemble */
      tl.fromTo(
        "#f06-msg",
        { opacity: 0, scale: 0.95 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false },
        2.4,
      );
      tl.fromTo(
        ".f06-msg-in",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power2.out", stagger: 0.06, immediateRender: false },
        2.52,
      );

      /* tray chips appear on the drag cue (VO "แล้วลากชื่อลูกค้า..." @2.72) */
      tl.fromTo(
        "#f06-traylabel",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power2.out", immediateRender: false },
        2.55,
      );
      tl.fromTo(
        "#f06-chip-1",
        { opacity: 0, y: 12, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
        2.62,
      );
      tl.fromTo(
        "#f06-chip-2",
        { opacity: 0, y: 12, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "power3.out", immediateRender: false },
        2.72,
      );

      /* ── Scene 3 (2.75–5.18s): cursor-drag ×2 — grab, ghost ride, drop-snap (tight) ── */

      /* cursor enters from the frame edge and approaches chip 1 */
      tl.set("#f06-cursor", { opacity: 1 }, 2.75);
      tl.fromTo(
        "#f06-cursor",
        { x: 1030, y: 1150 },
        {
          x: CHIP1.x + GRIP.dx,
          y: CHIP1.y + GRIP.dy,
          duration: 0.45,
          ease: "power2.inOut",
          immediateRender: false,
        },
        2.75,
      );

      /* grab 1: press dip on cursor + chip together (physics-press-reaction) */
      tl.to(["#f06-cursor", "#f06-chip-1"], { scale: 0.93, duration: 0.08, ease: "power1.in" }, 3.22);
      tl.set("#f06-ghost-1", { opacity: 0.65 }, 3.3);
      tl.fromTo(
        "#f06-ghost-1",
        { scale: 1 },
        { scale: 1.06, duration: 0.12, ease: "power2.out", immediateRender: false },
        3.3,
      );
      tl.to(["#f06-cursor", "#f06-chip-1"], { scale: 1, duration: 0.14, ease: "power2.out" }, 3.32);

      /* travel 1 — MATCHED tweens, absolute endpoints, same duration + ease (lockstep) */
      tl.fromTo(
        "#f06-ghost-1",
        { x: 0, y: 0 },
        { x: D1.x, y: D1.y, duration: 0.5, ease: "power2.inOut", immediateRender: false },
        3.5,
      );
      tl.fromTo(
        "#f06-cursor",
        { x: CHIP1.x + GRIP.dx, y: CHIP1.y + GRIP.dy },
        {
          x: CHIP1.x + GRIP.dx + D1.x,
          y: CHIP1.y + GRIP.dy + D1.y,
          duration: 0.5,
          ease: "power2.inOut",
          immediateRender: false,
        },
        3.5,
      );

      /* drop 1 — state commit: ghost off + placed field on at the same position */
      tl.set("#f06-ghost-1", { opacity: 0 }, 4.0);
      tl.set("#f06-slot-1", { opacity: 0 }, 4.0);
      tl.fromTo(
        "#f06-placed-1",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false },
        4.0,
      );
      tl.fromTo(
        "#f06-selbox-1",
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false },
        4.06,
      );
      tl.fromTo(
        "#f06-selbox-1 .f06-handle",
        { scale: 0.4 },
        { scale: 1, duration: 0.14, ease: "power3.out", stagger: 0.02, immediateRender: false },
        4.08,
      );
      tl.to("#f06-selbox-1", { opacity: 0, duration: 0.18, ease: "power1.out" }, 4.35);

      /* approach chip 2 */
      tl.to(
        "#f06-cursor",
        { x: CHIP2.x + GRIP.dx, y: CHIP2.y + GRIP.dy, duration: 0.33, ease: "power2.inOut" },
        4.15,
      );

      /* grab 2 */
      tl.to(["#f06-cursor", "#f06-chip-2"], { scale: 0.93, duration: 0.08, ease: "power1.in" }, 4.5);
      tl.set("#f06-ghost-2", { opacity: 0.65 }, 4.58);
      tl.fromTo(
        "#f06-ghost-2",
        { scale: 1 },
        { scale: 1.06, duration: 0.12, ease: "power2.out", immediateRender: false },
        4.58,
      );
      tl.to(["#f06-cursor", "#f06-chip-2"], { scale: 1, duration: 0.14, ease: "power2.out" }, 4.6);

      /* travel 2 — matched pair */
      tl.fromTo(
        "#f06-ghost-2",
        { x: 0, y: 0 },
        { x: D2.x, y: D2.y, duration: 0.4, ease: "power2.inOut", immediateRender: false },
        4.78,
      );
      tl.fromTo(
        "#f06-cursor",
        { x: CHIP2.x + GRIP.dx, y: CHIP2.y + GRIP.dy },
        {
          x: CHIP2.x + GRIP.dx + D2.x,
          y: CHIP2.y + GRIP.dy + D2.y,
          duration: 0.4,
          ease: "power2.inOut",
          immediateRender: false,
        },
        4.78,
      );

      /* drop 2 — lands on VO cue "มาวางในช่องข้อความ" @5.16 */
      tl.set("#f06-ghost-2", { opacity: 0 }, 5.18);
      tl.set("#f06-slot-2", { opacity: 0 }, 5.18);
      tl.fromTo(
        "#f06-placed-2",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false },
        5.18,
      );
      tl.fromTo(
        "#f06-selbox-2",
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false },
        5.24,
      );
      tl.fromTo(
        "#f06-selbox-2 .f06-handle",
        { scale: 0.4 },
        { scale: 1, duration: 0.14, ease: "power3.out", stagger: 0.02, immediateRender: false },
        5.26,
      );
      tl.to("#f06-selbox-2", { opacity: 0, duration: 0.2, ease: "power1.out" }, 5.7);

      /* template complete (5.2–6.1) — mint flash; check stamp on "เท่านี้คือจบแล้ว" @6.48 */
      var ring = document.getElementById("f06-check-ring");
      var ringLen = ring.getTotalLength();
      ring.style.strokeDasharray = String(ringLen);
      ring.style.strokeDashoffset = String(ringLen);
      var tick = document.getElementById("f06-check-tick");
      var tickLen = tick.getTotalLength();
      tick.style.strokeDasharray = String(tickLen);
      tick.style.strokeDashoffset = String(tickLen);
      tl.fromTo(
        "#f06-msg-flash",
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power1.out", immediateRender: false },
        5.3,
      );
      tl.to("#f06-msg-flash", { opacity: 0, duration: 0.25, ease: "power1.out" }, 5.85);
      tl.to("#f06-check-ring", { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 6.5);
      tl.to("#f06-check-tick", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 6.72);

      /* gentle camera breathe under the drags, settling before the toggle beat */
      tl.to("#f06-canvas", { scale: 1.018, duration: 3.0, ease: "power1.inOut" }, 2.75);
      tl.to("#f06-canvas", { scale: 1, duration: 1.4, ease: "power2.inOut" }, 6.2);

      /* ── Scene 4 (7.15–8.6s): Active toggle on "กดแอคทีฟมุมขวาบน" @7.84 — line powers up ── */
      tl.to(
        "#f06-cursor",
        { x: TOGGLE.x, y: TOGGLE.y, duration: 0.7, ease: "power2.inOut" },
        7.15,
      );

      /* physics-press-reaction: cursor + track compress together, spring back together */
      tl.to(["#f06-cursor", "#f06-track"], { scale: 0.92, duration: 0.1, ease: "power1.in" }, 7.87);
      tl.to(["#f06-cursor", "#f06-track"], { scale: 1, duration: 0.32, ease: "back.out(2)" }, 7.97);

      /* switch commits: knob slides, track floods mint */
      tl.fromTo(
        "#f06-knob",
        { x: 0 },
        { x: 64, duration: 0.22, ease: "power3.out", immediateRender: false },
        7.97,
      );
      tl.fromTo(
        "#f06-track-on",
        { opacity: 0 },
        { opacity: 1, duration: 0.16, ease: "power1.in", immediateRender: false },
        7.97,
      );

      /* the whole line lights up in one beat */
      tl.fromTo(
        "#f06-wire-on",
        { opacity: 0 },
        { opacity: 1, duration: 0.28, ease: "power2.out", immediateRender: false },
        8.02,
      );
      tl.fromTo(
        "#f06-hook-lit",
        { opacity: 0 },
        { opacity: 1, duration: 0.28, ease: "power2.out", immediateRender: false },
        8.02,
      );
      tl.to(
        ["#f06-node-hook", "#f06-node-chat"],
        { scale: 1.045, duration: 0.13, ease: "power2.out" },
        8.02,
      );
      tl.to(
        ["#f06-node-hook", "#f06-node-chat"],
        { scale: 1, duration: 0.24, ease: "power2.out" },
        8.17,
      );

      /* cursor steps aside so the lit switch reads */
      tl.to("#f06-cursor", { x: 872, y: 84, duration: 0.35, ease: "power2.out" }, 8.2);

      /* pulses run the line (svg-icon-enrichment dash-flow — limited cycles, linear) */
      tl.fromTo(
        "#f06-wire-pulse",
        { opacity: 0 },
        { opacity: 0.9, duration: 0.25, ease: "power1.out", immediateRender: false },
        8.2,
      );
      var flow = { offset: 0 };
      var pulseEl = document.getElementById("f06-wire-pulse");
      tl.to(
        flow,
        {
          offset: -90 /* 3 × dash period (16+14) — integer multiple */,
          duration: 1.35,
          ease: "none",
          onUpdate: function () {
            pulseEl.style.strokeDashoffset = String(flow.offset);
          },
        },
        8.2,
      );

      /* ── Scene 5 (8.6–9.6s): badge pops above the line, still by ~9.05 ── */
      tl.fromTo(
        "#f06-badge",
        { opacity: 0, scale: 0.7, y: 16 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)", immediateRender: false },
        8.6,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["06-step3"] = tl;
    })();
  </script>
