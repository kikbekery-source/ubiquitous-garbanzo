  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ============ series clock — counts down 1s/s from 01:50:05 (6605s) ============ */
      const clockEl = document.getElementById("f05-step2-clock-digits");
      const CLOCK_BASE = 6605; /* 01:50:05 */
      const pad2 = (n) => String(n).padStart(2, "0");
      const clockDriver = { t: 0 };
      tl.to(clockDriver, {
        t: 17,
        duration: 17,
        ease: "none",
        onUpdate: () => {
          const r = CLOCK_BASE - Math.floor(clockDriver.t);
          clockEl.textContent =
            pad2(Math.floor(r / 3600)) + ":" + pad2(Math.floor((r % 3600) / 60)) + ":" + pad2(r % 60);
        },
      }, 0);

      /* ============ Scene 1 (0.0–0.8) — chapter card, quiet settle, hard cut via clip ============ */
      tl.fromTo("#f05-step2-chapter-inner", { scale: 1.045 }, { scale: 1, duration: 0.8, ease: "power2.out" }, 0);

      /* ============ Scene 2 (0.8–4.8) — stack reveals, URL typed, dot blinks ============ */
      tl.fromTo("#f05-step2-topbar", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.9);
      tl.fromTo("#f05-step2-cardA", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.85);
      tl.fromTo("#f05-step2-cardB", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.0);
      tl.fromTo("#f05-step2-connector", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, 1.1);

      /* macro move running underneath the whole shot */
      tl.fromTo("#f05-step2-zoom", { scale: 1 }, { scale: 1.014, duration: 16.1, ease: "none" }, 0.9);

      /* discrete-text-sequence — the link arrives in chunks (paste-like), pause, then the tail */
      const URL_SEQ = [
        { t: 0.0,  text: "" },
        { t: 0.15, text: "https://" },
        { t: 0.55, text: "https://n8n" },
        { t: 0.78, text: "https://n8n.myshop" },
        { t: 1.05, text: "https://n8n.myshop.app" },
        /* thinking pause */
        { t: 1.6,  text: "https://n8n.myshop.app/webhook/" },
        { t: 2.15, text: "https://n8n.myshop.app/webhook/orders" },
      ];
      const urlEl = document.getElementById("f05-step2-url");
      const urlAt = (time) => {
        for (let i = URL_SEQ.length - 1; i >= 0; i--) if (time >= URL_SEQ[i].t) return URL_SEQ[i].text;
        return "";
      };
      const typeDriver = { t: 0 };
      tl.to(typeDriver, {
        t: 2.9,
        duration: 2.9,
        ease: "none",
        onUpdate: () => { urlEl.textContent = urlAt(typeDriver.t); },
      }, 1.7);

      /* caret blink — deterministic sin square wave on the same timeline */
      const caretEl = document.getElementById("f05-step2-caret");
      const blink = { p: 0 };
      tl.to(blink, {
        p: Math.PI * 2 * 4.5,
        duration: 2.9,
        ease: "none",
        onUpdate: () => { caretEl.style.opacity = Math.sin(blink.p) >= 0 ? "1" : "0"; },
      }, 1.7);
      tl.set("#f05-step2-caret", { opacity: 0 }, 4.75);

      /* status dot — blinks slowly twice, then steady */
      tl.fromTo("#f05-step2-dot", { opacity: 1 }, { opacity: 0.25, duration: 0.55, ease: "power1.inOut" }, 1.5);
      tl.to("#f05-step2-dot", { opacity: 1, duration: 0.55, ease: "power1.inOut" }, 2.05);
      tl.to("#f05-step2-dot", { opacity: 0.25, duration: 0.55, ease: "power1.inOut" }, 2.6);
      tl.to("#f05-step2-dot", { opacity: 1, duration: 0.55, ease: "power1.inOut" }, 3.15);

      /* ============ Scene 3 (4.8–8.0) — warning banner slams into the seam, then docks ============ */
      tl.fromTo("#f05-step2-banner",
        { opacity: 0, scale: 1.7 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 4.8);
      /* impact jolt on both cards — one beat */
      tl.to(["#f05-step2-cardA", "#f05-step2-cardB"], { y: 5, duration: 0.09, ease: "power2.out" }, 4.88);
      tl.to(["#f05-step2-cardA", "#f05-step2-cardB"], { y: 0, duration: 0.26, ease: "back.out(2)" }, 4.98);
      /* holds ~2s, then shrinks and perches above the Test button */
      tl.to("#f05-step2-banner", { x: 260, y: -235, scale: 0.42, duration: 0.6, ease: "power3.inOut" }, 7.0);

      /* ============ Scene 4 (8.0–13.0) — press Test → pulse → data unfolds (control-target-sync) ============ */
      tl.fromTo("#f05-step2-cursor",
        { x: 250, y: 210, opacity: 0 },
        { x: 0, y: 0, opacity: 1, duration: 0.7, ease: "power2.inOut" }, 8.0);

      tl.addLabel("press", 8.85);
      /* press-sink */
      tl.to("#f05-step2-btn", { scale: 0.93, duration: 0.1, ease: "power2.in" }, "press");
      tl.to("#f05-step2-cursor", { scale: 0.9, duration: 0.1, ease: "power2.in" }, "press");
      /* spring back */
      tl.to("#f05-step2-btn", { scale: 1, duration: 0.32, ease: "back.out(2.2)" }, "press+=0.12");
      tl.to("#f05-step2-cursor", { scale: 1, duration: 0.32, ease: "back.out(2.2)" }, "press+=0.12");

      /* same beat — coral pulse flows down the connector from control to target */
      tl.fromTo("#f05-step2-pulse", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, "press+=0.1");
      tl.fromTo("#f05-step2-pulse", { y: 0 }, { y: 180, duration: 0.45, ease: "power1.in" }, "press+=0.1");
      tl.to("#f05-step2-pulse", { opacity: 0, duration: 0.1, ease: "none" }, "press+=0.5");

      /* the target answers — node card pops as the pulse lands */
      tl.to("#f05-step2-cardB", { scale: 1.02, duration: 0.12, ease: "power2.out" }, "press+=0.5");
      tl.to("#f05-step2-cardB", { scale: 1, duration: 0.3, ease: "power2.inOut" }, "press+=0.64");

      /* anchored-layout-expand — order card unfolds under the node.
         MASK_H matches the mask's authored CSS height exactly; the mask is never tweened. */
      const MASK_H = 300;
      tl.fromTo("#f05-step2-sheet", { y: -MASK_H }, { y: 0, duration: 0.55, ease: "power3.out" }, 9.5);
      tl.fromTo(".f05-step2-row",
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.3, stagger: 0.14, ease: "power2.out" }, 9.68);
      tl.fromTo("#f05-step2-sheet-head", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 9.62);

      /* cursor eases aside so the result reads */
