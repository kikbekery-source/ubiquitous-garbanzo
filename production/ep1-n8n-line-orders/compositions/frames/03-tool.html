  <div id="root" data-composition-id="03-tool" data-width="1080" data-height="1920">

  <script src="public/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var F = 1 / 60;

      /* ── Series clock: counts down from 01:58:41 across the whole frame (deterministic) ── */
      var clockEl = document.getElementById("f03-tool-clock-time");
      var CLOCK_START = 1 * 3600 + 58 * 60 + 41;
      var clock = { t: 0 };
      tl.to(
        clock,
        {
          t: 10,
          duration: 10,
          ease: "none",
          onUpdate: function () {
            var total = CLOCK_START - Math.floor(clock.t);
            var h = Math.floor(total / 3600);
            var m = Math.floor((total % 3600) / 60);
            var s = total % 60;
            clockEl.textContent =
              (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
          },
        },
        0,
      );

      /* ── Scene 1 (0.0–2.2s): 5 nodes spring-pop in (power3.out, group lands in one beat) ── */
      var nodeIds = [
        "#f03-tool-node-a",
        "#f03-tool-node-b",
        "#f03-tool-node-c",
        "#f03-tool-node-d",
        "#f03-tool-node-e",
      ];
      /* layered depth: far nodes (b, d) settle slightly dimmed */
      var nodeOpacity = [1, 0.88, 1, 0.88, 1];
      nodeIds.forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: nodeOpacity[i], y: 0, duration: 0.55, ease: "power3.out" },
          0.1 + i * 0.1,
        );
      });

      /* Connector lines draw themselves (svg-path-draw: measured lengths, staggered ~75%) */
      var edges = [
        "#f03-tool-edge-1",
        "#f03-tool-edge-2",
        "#f03-tool-edge-3",
        "#f03-tool-edge-4",
        "#f03-tool-edge-5",
      ];
      edges.forEach(function (sel) {
        var p = document.querySelector(sel);
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      edges.forEach(function (sel, i) {
        tl.to(
          sel,
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          0.9 + i * 0.3,
        );
      });

      /* ── Scene 2 (2.2–4.6s): nodes + lines converge, wordmark assembles ── */
      var CX = 540;
      var CY = 806;
      var nodeCenters = [
        { x: 250, y: 470 },
        { x: 830, y: 420 },
        { x: 890, y: 930 },
        { x: 220, y: 1080 },
        { x: 590, y: 1330 },
      ];
      nodeIds.forEach(function (sel, i) {
        tl.to(
          sel,
          {
            x: CX - nodeCenters[i].x,
            y: CY - nodeCenters[i].y,
            scale: 0.14,
            opacity: 0,
            duration: 0.75,
            ease: "power2.in",
          },
          2.45 + i * 0.06,
        );
      });
      tl.to(
        "#f03-tool-lines-g",
        {
          scale: 0.1,
          opacity: 0,
          svgOrigin: "540 806",
          duration: 0.85,
          ease: "power2.in",
        },
        2.5,
      );

      /* Assemble ring accent: one finite expanding pass at the impact beat */
      tl.fromTo(
        "#f03-tool-ring",
        { scale: 0.4, opacity: 0.7 },
        { scale: 2.2, opacity: 0, duration: 0.7, ease: "power2.out" },
        3.05,
      );

      /* Wordmark pops in — calm settle; glow blooms behind it, landing as ONE beat */
      tl.fromTo(
        "#f03-tool-wordmark",
        { scale: 0.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        3.15,
      );
      tl.fromTo(
        "#f03-tool-glow",
        { opacity: 0, scale: 0.85 },
        { opacity: 0.32, scale: 1, duration: 0.8, ease: "power2.out" },
        3.15,
      );

      /* Bounded glow breathe during the hold — finite phase tween, sin(0)=0, amp within ceiling */
      var glowEl = document.getElementById("f03-tool-glow");
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * 2,
          duration: 5.9,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            glowEl.style.opacity = String(0.32 + s * 0.03);
            glowEl.style.transform = "scale(" + (1 + s * 0.015) + ")";
          },
        },
        3.95,
      );

      /* ── Scene 3 (4.6–7.0s): Thai subline, waterfall-entry word by word (binary opacity) ── */
      var t0 = 4.7; /* anchor phrase: heaviest — biggest travel, longest settle */
      tl.set("#f03-tool-word-1", { opacity: 1, y: 70 }, t0);
      tl.to("#f03-tool-word-1", { y: 0, duration: 0.18, ease: "power4.out" }, t0);
      var t1 = t0 + 0.18 + 2 * F; /* light dash: snaps in tight */
      tl.set("#f03-tool-word-2", { opacity: 1, y: 40 }, t1);
      tl.to("#f03-tool-word-2", { y: 0, duration: 0.12, ease: "power4.out" }, t1);
      var t2 = t1 + 0.12 - F; /* closing phrase: overlaps the dash */
      tl.set("#f03-tool-word-3", { opacity: 1, y: 55 }, t2);
      tl.to("#f03-tool-word-3", { y: 0, duration: 0.16, ease: "power4.out" }, t2);

      /* Lockup nudges up to make room for the badge row */
      tl.to("#f03-tool-lockup", { y: -22, duration: 0.6, ease: "power2.inOut" }, 6.85);

      /* ── Scene 4 (7.0–10.0s): badges snap in (spring-pop, stagger ≤0.5s), then held read ── */
      var pills = ["#f03-tool-pill-1", "#f03-tool-pill-2", "#f03-tool-pill-3"];
      pills.forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          7.1 + i * 0.22,
        );
      });
      /* 8.1s → 10s: held read — lockup dead still; only the clock ticks and the glow breathes */

      window.__timelines = window.__timelines || {};
      window.__timelines["03-tool"] = tl;
    })();
  </script>
