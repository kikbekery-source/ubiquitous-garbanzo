        /* ---------- virtual camera (viewport-change, single wrapper: T = -offset x S) ---------- */
        var world = $("p7-world");
        // Pose A frames the storefront card (world center 540, 580) at screen (540, 700):
        // Ty = 700 - 960 - S * (580 - 960) = -260 + 380 * S
        var cam = { x: 0, y: -260 + 380 * 1.08, scale: 1.08 };
        function applyCamera() {

        // arc fraction of a node center along the wire (deterministic sampling)
        function arcFrac(cx, cy) {

            bd = Infinity,

            l,
            q,
            d;
          for (i = 0; i <= 400; i++) {

            q = wire.getPointAtLength(l);
            d = (q.x - cx) * (q.x - cx) + (q.y - cy) * (q.y - cy);

        /* ================= Scene 1 (0.0–1.4) — storefront up immediately, press on กดสั่ง @1.24 ================= */
        tl.fromTo(
          "#p7-sf",

        );

          "#p7-topbar",
          { opacity: 0, y: -14 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: true },

        );

          "#p7-clock",
          { opacity: 0, y: -14 },

          cam,

            ease: "sine.inOut",
            onUpdate: function () {

        );

        tl.to("#p7-cursor", { x: 540, y: 780, duration: 0.7, ease: "power2.inOut" }, 0.45);

        tl.to("#p7-btn", { backgroundColor: "#0A0E16", duration: 0.12, ease: "power1.in" }, 1.25);
        tl.to(["#p7-btn", "#p7-cursor"], { scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.45);
        tl.to("#p7-btn", { backgroundColor: "#111725", duration: 0.35, ease: "power2.out" }, 1.45);
        tl.fromTo(
          "#p7-ripple",
          { scale: 0.35, opacity: 0.9 },
          { scale: 1.5, opacity: 0, duration: 0.45, ease: "power2.out" },

        );

        // pulse spawns at the button
        tl.fromTo(dotEl, { scale: 0 }, { scale: 1, duration: 0.18, ease: "back.out(2.5)" }, 1.32);

        /* ================= Scene 2 (1.4–2.7) — fast camera chase of the coral pulse ================= */
        var wmix = { v: 0 }; // pose-A → focus-lock blend (camera mode crossfade)
        var trav = { p: 0 };
        var A_X = 0,
          A_Y = -260 + 380 * 1.14;
        function travUpdate() {
          var p = Math.max(0, Math.min(1, trav.p));
          var pt = wire.getPointAtLength(p * LEN);
          var fx = -cam.scale * (pt.x - 540); // pulse locked to screen x 540
          var fy = -140 - cam.scale * (pt.y - 960); // pulse locked to screen y 820
          cam.x = A_X + (fx - A_X) * wmix.v;
          cam.y = A_Y + (fy - A_Y) * wmix.v;
          applyCamera();
          gsap.set(dotEl, { x: pt.x, y: pt.y });
          comet.style.strokeDashoffset = COMET - p * LEN;
        }
        tl.to(wmix, { v: 1, duration: 0.4, ease: "power2.inOut" }, TRAV_AT);
        tl.to(trav, { p: 1, duration: TRAV_DUR, ease: "power2.inOut", onUpdate: travUpdate }, TRAV_AT);
        tl.to(cam, { scale: 0.96, duration: 0.55, ease: "power2.in" }, 1.45);
        tl.to(cam, { scale: 1.06, duration: 0.65, ease: "power2.out" }, 2.0);

        // vertical velocity blur peaks at peak speed (~2.05s), sharp at the land
        tl.to(wb, { v: 16, duration: 0.6, ease: "power2.in", onUpdate: writeWB }, 1.45);
        tl.to(wb, { v: 0, duration: 0.62, ease: "power2.out", onUpdate: writeWB }, 2.05);

        // node hits as the pulse passes
        function nodePop(sel, at, restBorder) {
          tl.to(sel, { scale: 1.07, duration: 0.12, ease: "power2.out" }, at);
          tl.to(sel, { scale: 1, duration: 0.34, ease: "back.out(2)" }, at + 0.12);
          tl.to(sel, { borderColor: "#ff6d7e", duration: 0.1, ease: "none" }, at);
          tl.to(sel, { borderColor: restBorder, duration: 0.4, ease: "power2.out" }, at + 0.14);
        }
        nodePop("#p7-node1", tN1, "#111725");
        nodePop("#p7-node2", tN2, "#0A0E16");

        // seconds counter — 0.0 → 4.0 across the chase, landing on เข้าไลน์แล้ว @2.84
        tl.fromTo(
          "#p7-counter",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: true },
          1.35
        );
        tl.to(cnt, { v: 4, duration: 1.35, ease: "none", onUpdate: writeCnt }, 1.5);

        // clock ticks down slowly until the landing beat (01:40:33 → 01:40:30)
        tl.to(clock, { v: 6030, duration: 2.85, ease: "none", onUpdate: writeClock }, 0);

        /* ================= Scene 3 (2.85–4.6) — landing + clock collapse (signature) ================= */
        // camera settles onto the notification card
        tl.to(
          cam,
          { x: 0, y: -320 - 1670 * 1.02, scale: 1.02, duration: 0.6, ease: "power3.out", onUpdate: applyCamera },
          2.87
        );
        // pulse absorbed into the card on impact
        tl.to(dotEl, { scale: 0, duration: 0.22, ease: "power2.in" }, 2.85);

        // notification spring-pop on เข้าไลน์แล้ว @2.84
        tl.fromTo(
          "#p7-notif",
          { scale: 0.55, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: 0.6, ease: "back.out(1.8)", immediateRender: true },
          2.88
        );
        tl.fromTo(
          ".p7-bar",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.4, ease: "power3.out", stagger: 0.1, immediateRender: true },
          3.2
        );
        tl.fromTo(
          "#p7-chip1",
          { opacity: 0, y: 26, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)", immediateRender: true },
          3.65
        );
        tl.fromTo(
          "#p7-chip2",
          { opacity: 0, y: 26, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)", immediateRender: true },
          4.1
        );

        // THE BEAT — clock collapses in a fast downward blur to 00:00:04, same beat as the landing
        tl.to(clock, { v: 4, duration: 0.5, ease: "power3.in", onUpdate: writeClock }, 2.85);
        tl.to(cb, { v: 15, duration: 0.28, ease: "power2.in", onUpdate: writeCB }, 2.85);
        tl.to(cb, { v: 0, duration: 0.3, ease: "power3.out", onUpdate: writeCB }, 3.13);
        tl.to(clockDigits, { y: 9, duration: 0.28, ease: "power2.in" }, 2.85);
        tl.to(clockDigits, { y: 0, duration: 0.3, ease: "power3.out" }, 3.13);
        // one coral flash, then hold at 00:00:04
        tl.to(clockDigits, { color: "#ff6d7e", duration: 0.09, ease: "none" }, 3.36);
        tl.to(clockChip, { borderColor: "#ff6d7e", duration: 0.09, ease: "none" }, 3.36);
        tl.to(clockChip, { scale: 1.08, duration: 0.1, ease: "power2.out" }, 3.36);
        tl.to(clockChip, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 3.46);
        tl.to(clockDigits, { color: "#0A0E16", duration: 0.45, ease: "power2.out" }, 3.62);
        tl.to(clockChip, { borderColor: "#111725", duration: 0.45, ease: "power2.out" }, 3.62);

        // counter lands on 4.0 with the same beat
        tl.to("#p7-counter", { scale: 1.1, duration: 0.1, ease: "power2.out" }, 2.85);
        tl.to("#p7-counter", { scale: 1, duration: 0.35, ease: "back.out(2)" }, 2.95);
        tl.to(cntEl, { color: "#ff6d7e", duration: 0.1, ease: "none" }, 2.85);
        tl.to(cntEl, { color: "#0A0E16", duration: 0.4, ease: "power2.out" }, 3.15);

        // quiet macro push while the proof reads
        tl.to(
          cam,
          {
            scale: 1.045,
            duration: 3.8,
            ease: "sine.inOut",
            onUpdate: function () {
              cam.y = -320 - 1670 * cam.scale;
              applyCamera();
            },
          },
          3.5
        );

        /* ================= Scene 4 (4.7–7.4) — before/after strip (สองชั่วโมงต่อวัน @4.63 → เหลือศูนย์ @6.63) ================= */
        tl.fromTo(
          "#p7-cmp-old",
          { xPercent: -104 },
          { xPercent: 0, duration: 0.55, ease: "expo.out", immediateRender: true },
          4.7
        );
        tl.fromTo(
          "#p7-strike",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.4, ease: "power3.inOut", immediateRender: true },

        tl.fromTo(
          "#p7-cmp-new",

        );
        tl.to("#p7-zero", { scale: 1.3, duration: 0.12, ease: "power2.out" }, 6.65);
        tl.to("#p7-zero", { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 6.77);

        /* ================= Scene 5 (7.4–9.149) — kinetic-beat-slam hero (ไม่ต้องเฝ้าจอ @7.44) ================= */
        // context steps back; chrome + clock stay full
        tl.to(["#p7-world", "#p7-strip-in", "#p7-counter"], { opacity: 0.16, duration: 0.4, ease: "power2.inOut" }, 7.4);

        // one tempo grid: PULSE 0.35 from 7.5

        var B0 = 7.5;

          "#p7-band",

        gsap.utils.toArray(".p7-ticks i").forEach(function (tick, i) {
          var t = B0 + PULSE * i;

          tl.to(tick, { opacity: 0.22, duration: 0.15, ease: "power1.out" }, t + 0.08);
        });
        // finite settle breath, then hold to the cut (no exit — not the final frame)
        tl.to("#p7-band", { scale: 1.012, duration: 0.18, ease: "sine.inOut" }, 8.75);
        tl.to("#p7-band", { scale: 1, duration: 0.18, ease: "sine.inOut" }, 8.93);
      })();
